<!-- @dsCard group="Brand" viewport="700x200" name="Interaction states" subtitle="Hover, focus and disabled" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--deep);font-family:var(--font-body)}</style></head><body><div style="display:grid;gap:18px;color:var(--cream);font-size:12px">
<div style="display:flex;gap:16px;align-items:center">
<span style="background:var(--amber);color:var(--deep);padding:14px 28px;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.05em">Rest</span>
<span style="background:#B38A4F;color:var(--deep);padding:14px 28px;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.05em">Hover −10%</span>
<span style="border:1px solid var(--amber);color:var(--amber);padding:13px 27px;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.05em">Outline rest</span>
<span style="border:1px solid var(--amber);background:rgba(200,155,92,.15);color:var(--amber);padding:13px 27px;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.05em">Outline hover</span>
</div>
<div style="display:flex;gap:24px;align-items:center">
<span style="color:var(--cream);border-bottom:1px solid var(--amber);padding-bottom:4px;font-size:14px;text-transform:uppercase;letter-spacing:.05em">Ghost</span>
<span style="color:var(--amber);border-bottom:1px solid var(--amber);padding-bottom:4px;font-size:14px;text-transform:uppercase;letter-spacing:.05em">Ghost hover</span>
<span style="outline:2px solid var(--amber);outline-offset:3px;padding:6px 10px">Focus ring</span>
<span style="opacity:.45;background:var(--amber);color:var(--deep);padding:14px 28px;font-size:14px;text-transform:uppercase;letter-spacing:.05em">Disabled</span>
</div>
<div style="color:var(--mauve)">Color-only transitions at 140ms. No scale, no bounce, no shadow lift.</div></div></body></html>
